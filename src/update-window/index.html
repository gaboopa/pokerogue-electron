<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update progress</title><link rel="stylesheet" href="../ui/theme.css"><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="titlebar"><span id="title" class="titlebar-title"></span><button id="window-close" class="titlebar-close" aria-label="Close">x</button></div>
  <main>
    <div id="steps" aria-live="polite"></div>
    <div id="progress" role="progressbar" aria-label="Update download progress" aria-valuemin="0" aria-valuemax="100"><span></span></div>
    <footer><span>Gameplay keeps running while this downloads.</span><button id="cancel" class="secondary" type="button">Cancel</button></footer>
  </main>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
