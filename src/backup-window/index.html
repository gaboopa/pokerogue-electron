<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backups</title><link rel="stylesheet" href="../ui/theme.css"><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="titlebar"><span class="titlebar-title">Backups</span><button id="window-close" class="titlebar-close" aria-label="Close">x</button></div>
  <main>
    <div class="table-wrap frame"><div class="table-header"><span></span><span>CREATED</span><span>REASON</span><span>INTEGRITY</span></div><div id="backups" class="backup-list"></div>
      <div id="empty" class="empty" hidden><div>No Backups yet.</div><div>Use Saves › Back Up Saves… to create one.</div></div>
    </div>
    <p id="error" role="status"></p>
  </main>
  <footer><button id="choose" class="secondary">Choose Folder…</button><span></span><button id="close" class="secondary">Close</button><button id="restore" class="primary" disabled>Restore</button></footer>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
