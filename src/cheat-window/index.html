<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Cheat Control Center</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><div><p class="eyebrow">POKÉROGUE OFFLINE</p><h1>Cheat Control Center</h1><p>Changes are local, backed up, and applied after restart.</p></div><span id="state" class="state">VANILLA</span></header>
  <main>
    <section class="hero"><label class="switch"><input id="enabled" type="checkbox"><span></span><strong>Enable cheats</strong></label><button id="maximum" class="secondary">Maximum Fun Preset</button></section>
    <section><h2>Economy & progression</h2><div class="grid"><label>Minimum money <input id="minimumMoney" type="number" min="0" max="999999999"></label><label>XP multiplier <input id="xpMultiplier" type="number" min="1" max="100"></label><label>Extra candy per friendship <input id="extraCandy" type="number" min="0" max="100"></label></div><div class="checks"><label><input id="disableLevelCap" type="checkbox"> Disable level cap</label><label><input id="freeShopPurchases" type="checkbox"> Free shop purchases</label><label><input id="freeRerolls" type="checkbox"> Free rerolls</label><label><input id="freeGacha" type="checkbox"> Free Gacha pulls</label><label><input id="instantEggHatch" type="checkbox"> Instant egg hatching</label></div></section>
    <section><h2>Minimum Poké Ball inventory</h2><div class="grid balls"><label>Poké <input id="poke" type="number" min="0" max="999"></label><label>Great <input id="great" type="number" min="0" max="999"></label><label>Ultra <input id="ultra" type="number" min="0" max="999"></label><label>Rogue <input id="rogue" type="number" min="0" max="999"></label><label>Master <input id="master" type="number" min="0" max="999"></label></div></section>
    <section><h2>Battle & Pokémon</h2><div class="checks"><label><input id="forceRetries" type="checkbox"> Force battle retries</label><label><input id="guaranteedEscape" type="checkbox"> Guaranteed escape</label><label><input id="perfectIvs" type="checkbox"> Perfect player IVs</label><label><input id="playerShiny" type="checkbox"> Guaranteed player shinies</label><label><input id="enemyShiny" type="checkbox"> Guaranteed enemy shinies</label><label><input id="guaranteedCriticals" type="checkbox"> Guaranteed critical hits</label></div></section>
    <p id="message" role="status"></p>
  </main>
  <footer><button id="reset" class="danger">Reset to Vanilla</button><span></span><button id="cancel" class="secondary">Cancel</button><button id="apply" class="primary">Apply & Restart</button></footer>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
