<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="bar.css"><title>PokeRogue Electron</title></head>
<body><header id="bar" class="bar" role="menubar" aria-label="Main menu">
  <div class="logo" aria-hidden="true"></div><nav id="menus"></nav><div class="spacer"></div>

</header><div id="dropdown" class="dropdown" hidden></div><script type="module" src="renderer.mjs"></script></body></html>
