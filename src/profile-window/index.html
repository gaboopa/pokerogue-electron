<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Profile</title><link rel="stylesheet" href="../ui/theme.css"><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="titlebar"><span class="titlebar-title">New Profile</span><button id="window-close" class="titlebar-close" aria-label="Close">x</button></div>
  <main>
    <form id="create-form">
      <label for="profile-name">Profile name</label>
      <input id="profile-name" type="text" autocomplete="off" autofocus>
      <p id="error" role="alert" aria-live="polite">Gets its own saves, cheats and Backups. The app restarts.</p>
      <div class="buttons"><button id="cancel" class="secondary" type="button">Cancel</button><button class="primary" type="submit">Create and Restart</button></div>
    </form>
  </main>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
