name: Validate macOS updates

on:
  workflow_dispatch:
  push:
    branches:
      - codex/offline-review-updates

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: PokeRogue-Electron
    env:
      POKEROGUE_GAME_PATH: ${{ github.workspace }}/game
    steps:
      - name: Check out the update branch
        uses: actions/checkout@v7
        with:
          path: PokeRogue-Electron
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PokeRogue-Electron/package-lock.json

      - name: Read exact upstream pins
        id: pins
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const pins = JSON.parse(readFileSync("build/local-macos-build.json", "utf8"));
          for (const key of ["gameRevision", "assetsRevision", "localesRevision"]) {
            if (!/^[a-f0-9]{40}$/.test(pins[key])) throw new Error("Invalid revision " + key);
          }
          if (!/^\d+\.\d+\.\d+$/.test(pins.pnpmVersion)) throw new Error("Invalid pnpm version");
          appendFileSync(process.env.GITHUB_OUTPUT, "game=" + pins.gameRevision + "\npnpm=" + pins.pnpmVersion + "\n");
          NODE

      - name: Check out pinned upstream game and submodules
        uses: actions/checkout@v7
        with:
          repository: gaboopa/pokerogue
          ref: ${{ steps.pins.outputs.game }}
          submodules: recursive
          path: game
          persist-credentials: false

      - name: Verify source revisions
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const pins = JSON.parse(readFileSync("build/local-macos-build.json", "utf8"));
          for (const [name, cwd] of [["game", process.env.POKEROGUE_GAME_PATH], ["assets", process.env.POKEROGUE_GAME_PATH + "/assets"], ["locales", process.env.POKEROGUE_GAME_PATH + "/locales"]]) {
            const actual = execFileSync("git", ["rev-parse", "HEAD"], { cwd, encoding: "utf8" }).trim();
            if (actual !== pins[name + "Revision"]) throw new Error(name + " pin mismatch");
          }
          NODE

      - name: Install locked dependencies
        env:
          PNPM_VERSION: ${{ steps.pins.outputs.pnpm }}
        run: |
          npm ci
          npm exec --yes --package="pnpm@$PNPM_VERSION" -- pnpm --dir "$POKEROGUE_GAME_PATH" install --frozen-lockfile

      - name: Run wrapper tests including native Electron probes
        run: |
          npm test
          node test/mac-signing-fs.test.cjs

      - name: Build the upstream game and unsigned arm64 DMG
        run: npm run package:mac -- --publish never

      - name: Verify unsigned mounted DMG
        run: |
          dmg=$(find release -maxdepth 1 -name '*-macos-arm64.dmg' -type f -print -quit)
          test -n "$dmg"
          node scripts/verify-mac-package.mjs "$dmg"

      - name: Create and verify a separate local ad-hoc DMG
        run: |
          node --require ./scripts/mac-signing-fs.cjs ./node_modules/electron-builder/cli.js --mac dmg --arm64 --publish never \
            -c.mac.identity=- -c.mac.hardenedRuntime=false -c.dmg.sign=false \
            -c.directories.output=release/local \
            '-c.mac.artifactName=PokeRogue-Offline-${version}-macos-arm64-LOCAL-ONLY-DO-NOT-DISTRIBUTE.${ext}'
          dmg=$(find release/local -maxdepth 1 -name '*.dmg' -type f -print -quit)
          test -n "$dmg"
          node scripts/verify-mac-package.mjs --local "$dmg"

      - name: Generate release metadata without publishing
        run: |
          version=$(node -p "require('./package.json').version")
          dmg=$(find release -maxdepth 1 -name '*-macos-arm64.dmg' -type f -print -quit)
          npm run release:manifest -- "$dmg" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/PokeRogue-Offline-$version-macos-arm64.dmg" macos arm64

      - name: Record native validation evidence
        run: |
          mkdir -p release/validation
          {
            echo "Validation only. No release assets were published."
            echo "Hands-on Dock, Gatekeeper, and upgrade QA remains pending."
            git rev-parse HEAD
            sw_vers
            uname -m
            node --version
            node -p "require('electron/package.json').version"
            cat staging/revisions.json
            shasum -a 256 release/*-macos-arm64.dmg release/release-manifest.json
          } > release/validation/macos.txt

      - name: Retain public-policy artifacts and evidence for hands-on QA
        uses: actions/upload-artifact@v7
        with:
          name: macos-validation-${{ github.sha }}
          path: |
            PokeRogue-Electron/release/*-macos-arm64.dmg
            PokeRogue-Electron/release/release-manifest.json
            PokeRogue-Electron/release/validation/macos.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
